<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Resizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
     <h1>PDF Resizer</h1>
    <p class="subtitle">Shrink a PDF to a target file size. No pages are ever removed.</p>

    <form id="form">
      <label class="dropzone" id="dropzone" for="file">
        <span id="fileLabel">Click to choose a PDF, or drag one here</span>
      </label>
      <input type="file" id="file" name="file" accept="application/pdf" required hidden />

      <div class="size-row">
        <label for="targetSize">Target size</label>
        <input type="number" id="targetSize" min="0.01" step="0.01" placeholder="5" required />
        <select id="unit">
          <option value="MB" selected>MB</option>
          <option value="KB">KB</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Resize PDF</button>
    </form>

    <div id="status" class="status" hidden></div>
    <div id="result" class="result" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
